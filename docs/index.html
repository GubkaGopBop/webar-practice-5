<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf1ef">
  <title>Практика 5 · Мебель в AR</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="overlay">
    <section id="intro" class="card">
      <h1>Мебель в AR</h1>
      <p class="hint">Найдите пол и разместите объект.</p>
      <button id="start" disabled>Открыть AR</button>
      <button id="preview" class="secondary">Посмотреть в 3D</button>
      <p id="support" class="hint" role="status">Проверяем поддержку AR…</p>
    </section>
    <section id="hud" class="card" hidden>
      <div class="model-row"><label class="model-label"><span class="sr-only">Модель</span><select id="model"><option value="chair">Офисное кресло</option><option value="stool">Барный табурет</option></select></label><button id="exit" class="text">Выйти</button></div>
      <div class="row"><label class="color-label">Цвет<input id="color" type="color" value="#345e57"></label><label class="toggle"><input id="auto" type="checkbox"> Автовращение</label></div>
      <div class="row"><button id="left" class="secondary" aria-label="Повернуть влево на 15 градусов">↶ −15°</button><button id="right" class="secondary" aria-label="Повернуть вправо на 15 градусов">+15° ↷</button></div>
      <p id="status" class="hint" role="status" aria-live="polite"></p>
      <button id="place" disabled>Разместить здесь</button><button id="reset" class="secondary" hidden>Выбрать другое место</button>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
  <script type="module">import('./app.js').catch(error=>{document.querySelector('#support').textContent='Не удалось загрузить сцену.'; const el=document.querySelector('#error');el.hidden=false;el.textContent=error.message;});</script>
</body>
</html>
